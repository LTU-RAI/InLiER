# --------------------------------------------------------------------------
#  InLiER — default configuration for encoder, matcher, and verification
# --------------------------------------------------------------------------

# Preprocessing
voxel_size: 0.5             # DESCRIPTOR voxel (encoder inputs) only

# --- InLiER encoder -------------------------------------------------------
encoder:
  N_h: 10                   # number of height slices
  z_min: 0.0                # lower z boundary above ground (metres)
  z_max: 20.0               # upper z boundary above ground (metres)
  N_r: 20                   # radial bins
  N_s: 7                    # shape classes
  N_a: 60                   # azimuth bins
  r_max: 100.0              # max radius for azimuth/radial binning (metres)
  xy_max: 100.0             # XY half-extent for height-cell grid (metres)
  cell_size: 1.0            # metres per BEV cell (recommended: 2.0 * voxel_size)
  window: 3                 # local-maxima NMS window (odd)
  point_mode: "keypoints"   # "keypoints" | "all_points"

# --- Stage-1 shortlist (MINT retrieval) -----------------------------------
stage1:
  topk: 100                 # shortlist size (ignored if topk_pct is set)
  topk_pct: 0.10            # fraction of DB size (e.g. 0.1 = top 10%)
  min_shared_rows: 3        # min shared height rows to score a candidate
  mint_mode: "compact"      # "compact" (collapse height) | "full" (preserve height)
  mint_scoring: "l1_intersection"    # "cosine" | "raw_intersection" | "l1_intersection"

# --- Stage-2 BEAM (azimuth-shift reranking) -------------------------------
stage2:
  skip: false
  topk: 20                  # candidates after Stage-2 (ignored if topk_pct)
  topk_pct: null            # fraction of Stage-1 shortlist
  min_shared_bins: 4        # min shared spatial bins for valid score
  min_shared_az_cols: 3     # min shared azimuth columns
  score_threshold: 0.0      # deployment threshold (eval uses -2.0)

# --- Rerank stage (4-D histogram scoring, not used by default) -------------
rerank:                     # not part of the paper, can give small boost in some cases
  run: false
  topk: 50                  # candidates from Stage-2 to rerank
  scoring_mode: "jaccard4d" # "jaccard4d" | "cosine4d"
  score_threshold: 0.0      # deployment threshold (eval uses -2.0)

# --- Geometric verification -----------------------------------------------
verify:
  skip: false
  topv: 20                   # top-V candidates to verify per query
  ransac_iters: 500
  inlier_dist: 1.0          # RANSAC inlier distance (metres) and inlier ratio threshold
  min_correspondences: 32
  min_ransac_inliers: 16
  min_keypoint_inliers: 8
  spatial_tol: 0             # ±bins for token correspondence matching

# --- GICP refinement (6-DOF pose on TP pairs) ----------------------------
gicp:
  skip: false
  registration_type: "GICP"        # GICP | VGICP | ICP | PLANE_ICP
  max_correspondence_distance: 1.5 # metres
  use_raw_clouds: true             # if false, use keypoints
  downsampling_resolution: 0.2     # GICP's OWN registration voxel (m); ≤0 to skip
  voxel_resolution: 1.0            # VGICP only
  num_threads: 8
  max_iterations: 16    
